<svg viewBox="0 0 2400 430" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#2c4a6e"/>
      <stop offset="100%" stop-color="#152a45"/>
    </linearGradient>

    <radialGradient id="glowWarm" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#d9a441" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd98a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="coneLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffe6ad" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffe6ad" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1b2e" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="2400" height="430" fill="url(#bg)"/>

  <!-- Тёплое сияние по центру -->
  <ellipse cx="1200" cy="0" rx="900" ry="420" fill="url(#glowWarm)"/>

  <!-- Мягкая текстура точек (частицы света) -->
  <g opacity="0.5">
    <circle cx="950" cy="120" r="2" fill="#ffe6ad"/>
    <circle cx="1080" cy="90" r="1.5" fill="#ffe6ad"/>
    <circle cx="1320" cy="140" r="2" fill="#ffe6ad"/>
    <circle cx="1450" cy="80" r="1.5" fill="#ffe6ad"/>
    <circle cx="1180" cy="200" r="1.5" fill="#ffe6ad"/>
    <circle cx="1600" cy="160" r="2" fill="#ffe6ad"/>
  </g>

  <!-- ===== Подвесной светильник 1 ===== -->
  <g>
    <line x1="980" y1="0" x2="980" y2="95" stroke="#0d1b2e" stroke-width="3"/>
    <rect x="965" y="93" width="30" height="14" rx="3" fill="#0d1b2e"/>
    <path d="M 930 107 Q 980 150 1030 107 L 1030 112 Q 980 158 930 112 Z" fill="#152a45" stroke="#0d1b2e" stroke-width="2"/>
    <ellipse cx="980" cy="160" rx="26" ry="30" fill="url(#bulbGlow)"/>
    <circle cx="980" cy="158" r="10" fill="#fff3d6"/>
    <path d="M 900 158 L 1060 158 L 1200 430 L 760 430 Z" fill="url(#coneLight)"/>
  </g>

  <!-- ===== Подвесной светильник 2 (крупнее, центр) ===== -->
  <g>
    <line x1="1200" y1="0" x2="1200" y2="60" stroke="#0d1b2e" stroke-width="3"/>
    <rect x="1182" y="58" width="36" height="16" rx="3" fill="#0d1b2e"/>
    <path d="M 1120 74 Q 1200 135 1280 74 L 1280 82 Q 1200 145 1120 82 Z" fill="#1e3a5f" stroke="#0d1b2e" stroke-width="2"/>
    <ellipse cx="1200" cy="150" rx="34" ry="38" fill="url(#bulbGlow)"/>
    <circle cx="1200" cy="147" r="13" fill="#fff3d6"/>
    <path d="M 1090 147 L 1310 147 L 1480 430 L 920 430 Z" fill="url(#coneLight)"/>
  </g>

  <!-- ===== Подвесной светильник 3 ===== -->
  <g>
    <line x1="1420" y1="0" x2="1420" y2="100" stroke="#0d1b2e" stroke-width="3"/>
    <rect x="1405" y="98" width="30" height="14" rx="3" fill="#0d1b2e"/>
    <path d="M 1370 112 Q 1420 152 1470 112 L 1470 117 Q 1420 160 1370 117 Z" fill="#152a45" stroke="#0d1b2e" stroke-width="2"/>
    <ellipse cx="1420" cy="163" rx="24" ry="28" fill="url(#bulbGlow)"/>
    <circle cx="1420" cy="161" r="9" fill="#fff3d6"/>
    <path d="M 1345 161 L 1495 161 L 1600 430 L 1240 430 Z" fill="url(#coneLight)"/>
  </g>

  <!-- Настенное бра слева на дальнем плане -->
  <g opacity="0.55">
    <rect x="270" y="90" width="10" height="24" rx="2" fill="#0d1b2e"/>
    <path d="M 245 114 Q 275 140 305 114 L 305 120 Q 275 148 245 120 Z" fill="#1e3a5f"/>
    <ellipse cx="275" cy="150" rx="16" ry="20" fill="url(#bulbGlow)"/>
  </g>

  <!-- Настенное бра справа на дальнем плане -->
  <g opacity="0.5">
    <rect x="2110" y="80" width="10" height="24" rx="2" fill="#0d1b2e"/>
    <path d="M 2085 104 Q 2115 128 2145 104 L 2145 110 Q 2115 136 2085 110 Z" fill="#1e3a5f"/>
    <ellipse cx="2115" cy="138" rx="15" ry="18" fill="url(#bulbGlow)"/>
  </g>

  <!-- Виньетка снизу для плавного перехода к контенту -->
  <rect x="0" y="0" width="2400" height="430" fill="url(#vignette)"/>
</svg>
